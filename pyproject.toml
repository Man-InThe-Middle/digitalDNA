[project]
name='digitaldna'
version='1.0.0'
description='DigitalDNA - Evidence-driven public identity intelligence platform'
requires-python='>=3.12,<3.13'
dependencies=['fastapi>=0.115,<1','uvicorn[standard]>=0.34,<1','pydantic>=2.10,<3','pydantic-settings>=2.7,<3','rapidfuzz>=3.10,<4','python-multipart>=0.0.20,<1']
[project.optional-dependencies]
test=['pytest>=8.3,<9','pytest-asyncio>=0.25,<1']
[build-system]
requires=['setuptools>=75']
build-backend='setuptools.build_meta'

[tool.pytest.ini_options]
pythonpath=['.']
testpaths=['tests']
